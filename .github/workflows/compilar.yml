name: Compilar

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas del motor local
        run: node pruebas/motor.test.js
      - name: Pruebas de la interfaz en Chrome
        run: node pruebas/interfaz.test.js "$(which google-chrome)" capturas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: capturas

  android:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Instalar Capacitor
        run: npm install
      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --assetPath recursos --iconBackgroundColor '#111827' --splashBackgroundColor '#0f141b'
          npx cap sync android
      - name: Poner número de versión
        run: |
          VER=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VER\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Compilar APK
        run: cd android && ./gradlew assembleRelease --no-daemon
      # La llave de firma vive sólo en la PC del dueño: este APK sale SIN firmar
      # y se firma en local con firmar-apk.ps1, que también lo sube a la versión.
      - name: Alinear APK sin firmar
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk Taller-Mecanico-sin-firmar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-sin-firmar
          path: Taller-Mecanico-sin-firmar.apk

  windows:
    needs: pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copiar la app web
        shell: bash
        run: |
          cp -r www escritorio/app
          mkdir -p escritorio/recursos
          cp recursos/icon.png escritorio/recursos/icon.png
      - name: Compilar instalador y portable
        working-directory: escritorio
        run: |
          npm install
          npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: escritorio/dist/*.exe

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: descargas
      - name: Crear versión con las descargas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" descargas/windows/*.exe \
            --title "Taller Mecánico $GITHUB_REF_NAME" --notes-file docs/COMO-INSTALAR.md
